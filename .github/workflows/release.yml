name: Release

# Tag-triggered, because the tag is the only thing that says "this version is
# the one". Pushing to main does not release; `git tag v0.3.0 && git push
# --tags` does.
#
# INERT UNTIL THE SECRETS EXIST. Without SVN_USERNAME and SVN_PASSWORD the
# deploy step fails rather than half-publishing, which is the right way round —
# a release that silently did nothing is worse than one that stops and says so.
on:
  push:
    tags:
      - 'v*'
    # readme.txt and the images are versioned separately from the code on
    # wordpress.org, so a typo in the description or a new screenshot reaches
    # the listing without a release. See the `assets` job.
    branches:
      - main
    paths:
      - 'readme.txt'
      - 'assets/**'

permissions:
  contents: write

jobs:
  release:
    name: Publish to wordpress.org
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # The tag has to agree with the four places the version is written, or
      # the directory serves something other than what was tagged. package.php
      # already checks the other three against each other; this checks the tag
      # against them, which is the one comparison it cannot make by itself.
      - name: The tag must match the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 -oE '^\s*\*\s*Version:\s*\S+' schemapress.php | awk '{print $NF}')

          if [ "$tag" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin header version $declared."
            exit 1
          fi

      - run: npm ci

      - run: composer install

      - run: npm run build

      - name: The committed build must match the source
        run: |
          if ! git diff --quiet -- build/; then
            echo "build/ is out of date for this tag."
            exit 1
          fi

      - run: npm test

      # Builds the zip from `git ls-files` filtered through .distignore, and
      # rebuilds vendor/ with --no-dev. Also refuses to run at all if the
      # header, the constant, readme.txt and package.json disagree.
      - run: npm run package

      - name: Publish
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: schemapress
          BUILD_DIR: false

      - name: Attach the zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: schemapress.*.zip
          generate_release_notes: true

  assets:
    name: Update the directory listing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: schemapress
          ASSETS_DIR: assets
