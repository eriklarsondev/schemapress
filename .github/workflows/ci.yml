name: CI

# Every push and every pull request. The suite is a plain PHP script with no
# database and no WordPress, so it costs seconds — there is no version of this
# worth running less often than that.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      # a failure on 8.2 should not hide whether 8.4 is also broken
      fail-fast: false
      matrix:
        # 8.2 is the floor the plugin header declares, because Timber 2 needs
        # it. the newest stable is the ceiling, so a deprecation lands here
        # rather than on somebody's site
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        # the suite loads most of the plugin but not all of it — uninstall.php
        # never runs under it by design, and a parse error there would only
        # surface when somebody deleted the plugin
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Run the suite
        run: php tests/run.php

  review:
    name: wordpress.org review checks
    runs-on: ubuntu-latest

    # phpcs.xml.dist is not the full WordPress standard — it is the subset a
    # directory review blocks on: escaping, sanitising, nonces, capabilities,
    # prepared SQL, prefixes, and the PHP versions the header promises. The
    # reasoning for what is left out is at the top of that file.

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install

      - run: composer lint

  static:
    name: Lint and format
    runs-on: ubuntu-latest

    # The pre-commit hook formats everything it is given, so in the ordinary
    # case the formatting steps have nothing to find. They exist for the cases
    # where the hook was not in the way: --no-verify, an edit made through the
    # GitHub web UI, a contributor who cloned and never ran npm install.
    #
    # ESLint is here rather than in the hook on purpose. It would have to run
    # on the same files Prettier is rewriting, and lint-staged runs separate
    # glob groups concurrently — two processes writing one file. Catching this
    # class of error a few minutes later is worth more than that race.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: npm ci

      - run: composer install

      - name: ESLint
        run: npm run lint:js

      - name: Prettier
        run: npm run format:js:check

      - name: PHP-CS-Fixer
        run: npm run format:php:check

  vendor:
    name: Committed vendor/
    runs-on: ubuntu-latest

    # vendor/ is committed, so `composer install` writing require-dev into the
    # same tree is a real way to ship a formatter to every site running this
    # plugin. .gitignore names every dev package so none of them can be added
    # by accident; this is the check from the other side, and it does not care
    # what the ignore list currently says.
    #
    # installed.json is written by whichever install produced the tree, and it
    # lists exactly which of its packages came from require-dev. If that list
    # is not empty in a commit, the committed vendor/ is a dev install.

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: vendor/ must be a --no-dev install
        run: php bin/vendor-no-dev

  build:
    name: Build the admin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: The committed build must match the source
        # the plugin ships built, so build/ is committed alongside the change
        # that needed it. a build that comes out different from what is in the
        # tree means somebody edited src/ and did not rebuild — which ships an
        # admin that does not match its own source
        run: |
          if ! git diff --quiet -- build/; then
            echo "build/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- build/
            exit 1
          fi
