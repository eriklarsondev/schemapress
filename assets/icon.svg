<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SchemaPress">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2748"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the tile, in the admin's own appbar navy -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#sheen)"/>

  <!-- row one: the named shape. a filled marker and a full-width bar -->
  <rect x="48" y="69" width="26" height="26" rx="8" fill="#3f6fe0"/>
  <rect x="86" y="69" width="122" height="26" rx="8" fill="#ffffff" fill-opacity="0.95"/>

  <!-- row two: a typed field -->
  <rect x="48" y="115" width="26" height="26" rx="8" fill="#4a5a85"/>
  <rect x="86" y="115" width="64" height="26" rx="8" fill="#ffffff" fill-opacity="0.62"/>

  <!--
    row three: the marker, then two squares rather than a bar. Every square in
    the mark is the same 26, and EVERY gap is 12 — marker to content on all
    three rows, and between the two squares here. That one number is what makes
    the bottom row read as a pair rather than as two strays.

    The middle bar is 64 because of it: 26 + 12 + 26 is what two squares and
    their gap come to, so rows two and three end together at 150. Setting the
    bar first and fitting squares into it is what put a 38 hole in this row.
  -->
  <rect x="48" y="161" width="26" height="26" rx="8" fill="#4a5a85"/>
  <rect x="86" y="161" width="26" height="26" rx="8" fill="#ffffff" fill-opacity="0.42"/>
  <rect x="124" y="161" width="26" height="26" rx="8" fill="#ffffff" fill-opacity="0.42"/>
</svg>
